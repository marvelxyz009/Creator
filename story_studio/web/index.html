<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Creator · Xưởng truyện</title>
<style>
:root{--ink:#272924;--muted:#76796f;--paper:#f4f3ed;--line:#dedfd5;--accent:#52734b}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;color:var(--ink);background:var(--paper)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:white;padding:9px 14px;color:var(--ink)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:hover{filter:brightness(.96)}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 34px;background:#fafbf6}header strong{font-size:21px;letter-spacing:-.8px}header small{color:var(--muted);margin-left:14px}main{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 76px)}aside{border-right:1px solid var(--line);padding:25px 18px}aside button{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent}aside button.active{background:#e4ecde;border-color:#c6d5bc}.overline{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}#workspace{padding:35px 42px;max-width:1400px;width:100%}h1{font-size:34px;font-weight:550;letter-spacing:-1.2px;margin:0 0 8px}h2{font-size:21px;font-weight:550;margin-top:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px;margin-top:25px}.card{background:#fffef9;border:1px solid var(--line);padding:22px;border-radius:10px}.tag{font-size:12px;padding:3px 8px;background:#e9eee3;border-radius:4px;display:inline-block;margin:3px}label{display:block;margin-top:13px;font-size:13px;color:#555a50}input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);background:#fffefa;border-radius:6px;color:var(--ink)}textarea{min-height:120px;resize:vertical}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.tabs{display:flex;gap:10px;margin:25px 0}.tabs button{background:transparent}.tabs button.active{border-color:var(--accent);color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.9 ui-monospace,monospace;max-height:650px;overflow:auto;background:#fffef9;padding:23px;border:1px solid var(--line);border-radius:8px}.job{display:flex;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.job .desc{flex:1}.status{font-size:12px;color:var(--accent)}.error{color:#a44233;font-size:13px}#notice{position:fixed;bottom:22px;right:24px;padding:12px 18px;background:var(--ink);color:white;border-radius:7px;max-width:500px;z-index:4}img.page{width:min(100%,600px);display:block;margin:20px auto}dialog{width:min(630px,95vw);border:1px solid var(--line);border-radius:12px;padding:30px;background:var(--paper)}dialog::backdrop{background:#25282066}input[type=checkbox]{width:auto}.genrelist{display:flex;gap:9px;flex-wrap:wrap}.genrelist label{background:white;padding:5px 9px;border:1px solid var(--line);border-radius:5px;margin:0}@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}aside button{display:inline-block;width:auto}#workspace{padding:25px 18px}header{padding:0 18px}header small{display:none}}
</style></head><body>
<header><div><strong>Creator</strong><small>XƯỞNG TRUYỆN · LOCAL STUDIO</small></div><button class="primary" onclick="newProject()">＋ Dự án mới</button></header>
<main><aside><div class="overline">Không gian làm việc</div><button id="navhome" onclick="home()">◈ Tổng quan</button><button id="navrefs" onclick="references()">▤ Thư viện tham khảo</button><div class="overline">Dự án</div><div id="projects"></div><div class="overline">Trợ lý sáng tạo</div><div id="provider" class="muted"></div><select id="engine" aria-label="Bộ viết" onchange="action(()=>api('/api/provider',{mode:this.value}))"><option value="codex">Codex CLI</option><option value="claude">Claude Code CLI</option></select><details style="margin-top:16px"><summary>Các vai chuyên môn</summary><div id="skills"></div></details></aside><section id="workspace"></section></main><dialog id="modal"></dialog><div id="notice" hidden></div>
<script>
const token='__TOKEN__';let state={},selected=null,detail=null,tab='chapters',focused=null,phase='plot',chapter=1;
const labels={characters:'Thiết kế nhân vật',art:'Định hướng mỹ thuật',bible:'Hồ sơ series',outline:'Dàn ý',draft:'Bản thảo',edit:'Biên tập',continuity:'Kiểm tra canon',adaptation:'Chuyển thể',storyboard:'Storyboard',lettering:'Thiết kế thoại',image_prompt:'Brief vẽ',canon:'Canon đã chốt',page:'Trang manga'};
const statuses={queued:'Đang chờ',running:'Đang thực hiện',done:'Hoàn tất',failed:'Cần xử lý',needs_review:'Chờ duyệt'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s){let n=document.querySelector('#notice');n.textContent=s;n.hidden=false;setTimeout(()=>n.hidden=true,6500)}
async function api(path,data){let r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function action(fn){try{await fn();await load();if(selected)await openProject(selected,false)}catch(e){notice(e.message)}}
async function load(){state=await api('/api/state');document.querySelector('#projects').innerHTML=state.projects.map(p=>`<button class="${selected===p.id?'active':''}" onclick="openProject('${p.id}')">${esc(p.title)}</button>`).join('');document.querySelector('#provider').textContent=state.provider.model?`${state.provider.mode} · ${state.provider.model}`:`${state.provider.mode} · tài khoản CLI hiện hành`;document.querySelector('#engine').value=state.provider.mode;document.querySelector('#skills').innerHTML=state.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}
function home(){selected=null;document.querySelector('#workspace').innerHTML=`<div class="overline">Từ ý tưởng đến thành phẩm</div><h1>Mỗi câu chuyện, một thế giới.</h1><p class="muted">Viết bản gốc. Chốt từng chương. Chuyển thể thành manga với nguồn và phiên bản rõ ràng.</p><div class="cards"><div class="card"><h2>${state.projects.length} dự án</h2><p>Truyện ngắn, tiểu thuyết và series nhiều arc.</p></div><div class="card"><h2>${state.jobs.filter(j=>j.status==='running'||j.status==='queued').length} tác vụ đang chạy</h2><p>Tiến độ được lưu; lỗi có thể xử lý và tiếp tục.</p></div><div class="card"><h2>${state.references.length} tài liệu</h2><p>Tham khảo kỹ thuật kể chuyện theo thể loại.</p></div></div><div class="overline">Dự án của bạn</div><div class="cards">${state.projects.map(p=>`<div class="card"><h2>${esc(p.title)}</h2><p>${esc(p.idea.slice(0,150))}</p><div>${p.genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div><div class="actions"><button onclick="openProject('${p.id}')">Mở xưởng →</button></div></div>`).join('')||'<p class="muted">Bắt đầu bằng một ý tưởng. Xưởng sẽ giữ hồ sơ và tiến độ cho bạn.</p>'}</div>`}
function newProject(){const d=document.querySelector('#modal');d.innerHTML=`<h2>Bắt đầu một câu chuyện</h2><form id="create"><label>Tên dự án<input name="title" required placeholder="Một cái tên đáng nhớ"></label><label>Ý tưởng<textarea name="idea" required placeholder="Nhân vật muốn gì, điều gì ngăn họ, điều gì khiến câu chuyện này đáng kể?"></textarea></label><label>Thể loại</label><div class="genrelist">${state.genres.map(g=>`<label><input type="checkbox" name="genres" value="${esc(g)}"> ${esc(g)}</label>`).join('')}</div><div class="row"><label>Độ dài<select name="length"><option value="short">Truyện ngắn</option><option value="novella">Truyện vừa</option><option value="novel">Tiểu thuyết</option><option value="series">Series dài</option></select></label><label>Mức can thiệp<select name="mode"><option value="semi">Bán tự động</option><option value="auto">Tự động</option><option value="manual">Duyệt từng bước</option></select></label></div><div class="row"><label>Ngôn ngữ<input name="language" value="Tiếng Việt"></label><label>Đọc manga<select name="direction"><option value="rtl">Phải → trái</option><option value="ltr">Trái → phải</option><option value="vertical">Cuộn dọc</option></select></label></div><label>Hướng mỹ thuật<input name="style" value="Manga đen trắng, nét mực tự nhiên, thoại theo ngữ cảnh"></label><div class="actions"><button class="primary">Tạo dự án</button><button type="button" onclick="document.querySelector('#modal').close()">Đóng</button></div></form>`;d.showModal();document.querySelector('#create').onsubmit=e=>{e.preventDefault();action(async()=>{let f=new FormData(e.target),p=await api('/api/projects',{...Object.fromEntries(f),genres:f.getAll('genres')});d.close();selected=p.result.id;notice('Đã tạo dự án. Bắt đầu chương đầu khi sẵn sàng.');})}}
async function openProject(id,reset=true){selected=id;if(reset){phase='plot';chapter=1;focused=null;tab='chapters'}detail=await api('/api/project?id='+id);let p=detail.project;document.querySelector('#workspace').innerHTML=`<div class="overline">Xưởng sáng tạo · ${esc(p.language)}</div><h1>${esc(p.title)}</h1><p class="muted">${esc(p.idea)}</p><nav class="tabs" aria-label="Hành trình sáng tạo">${[['idea','Ý tưởng'],['plot','Cốt truyện'],['characters','Nhân vật'],['art','Mỹ thuật'],['production','Sản xuất']].map(([k,v],i)=>`<button class="${phase===k?'active':''}" onclick="phase='${k}';focused=null;openProject(selected,false)">${i+1}. ${v}</button>`).join('')}</nav><div class="row"><label style="max-width:180px">Chương đang làm<input id="chapter-number" type="number" min="1" value="${chapter}" onchange="chapter=Math.max(1,Number(this.value));focused=null;renderContent()"></label></div><div id="content"></div><details style="margin-top:30px"><summary>Chi tiết vận hành & lịch sử</summary><div class="actions"><button onclick="tab='queue';renderTechnical()">Tiến độ từng bước</button><button onclick="tab='chapters';renderTechnical()">Tất cả phiên bản</button><button onclick="startChapter()">Chọn bước chạy nâng cao</button><button onclick="action(()=>api('/api/pause',{project:selected,paused:!detail.project.paused}))">${p.paused?'Tiếp tục':'Tạm dừng'}</button></div><div id="technical"></div></details>`;renderContent()}
function renderTechnical(){let c=document.querySelector('#technical');if(tab==='queue'){c.innerHTML=detail.jobs.map(j=>`<div class="job"><div class="desc"><strong>Chương ${j.chapter} · ${labels[j.stage]}</strong><div class="error">${esc(j.error)}</div></div><span class="status">${statuses[j.status]} · ${j.attempts}/3</span>${j.status==='failed'&&j.attempts<3?`<button onclick="action(()=>api('/api/retry',{id:'${j.id}'}))">Thử lại</button>`:''}${j.status==='needs_review'?`<button onclick="action(()=>api('/api/continue',{id:'${j.id}'}))">${j.stage==='continuity'?'Chốt bản gốc & chuyển thể':'Duyệt & tiếp tục'}</button>`:''}</div>`).join('')||'<p class="muted">Chưa có tác vụ.</p>';return}if(tab==='reader'){c.innerHTML=detail.artifacts.filter(a=>a.kind==='page').map(a=>`<div class="card"><span class="tag">Chương ${a.chapter} · trang ${JSON.parse(a.body).number}</span>${a.stale?'<span class="error">Nguồn đã thay đổi — cần cập nhật</span>':''}<img class="page" alt="Trang manga" src="/api/page?project=${selected}&id=${a.id}"></div>`).join('')||'<p class="muted">Trang vẽ xuất hiện ở đây sau khi bản gốc đã chốt và hoàn thành brief.</p>';return}let a=detail.artifacts.find(a=>a.id===focused);c.innerHTML=`<div class="cards">${detail.artifacts.filter(a=>a.kind!=='page').slice().reverse().map(a=>`<button class="card" style="text-align:left" onclick="focused='${a.id}';renderTechnical()"> <strong>Chương ${a.chapter} · ${labels[a.kind]}</strong><div class="muted">${a.created.slice(0,16)} · ${a.approved?'Đã chốt':'Bản nháp'}${a.stale?' · Cần cập nhật':''}</div></button>`).join('')}</div>${a?`<div class="actions"><button onclick="revise('${a.id}')">Sửa thành phiên bản mới</button></div><pre>${esc(a.body)}</pre>`:'<p class="muted">Chọn một tài liệu để đọc hoặc chỉnh sửa. Mọi lần sửa tạo phiên bản mới.</p>'}`}
function startChapter(){let d=document.querySelector('#modal');d.innerHTML=`<h2>Chạy dây chuyền</h2><form id="run"><label>Chương<input name="chapter" type="number" min="1" value="1" required></label><label>Bắt đầu từ bước<select name="stage">${state.stages.map(s=>`<option value="${s}">${labels[s]}</option>`).join('')}</select></label><p class="muted">Bán tự động sẽ dừng để chốt bản gốc sau kiểm tra canon. Chuyển thể luôn dùng nguồn đã chốt.</p><div class="actions"><button class="primary">Đưa vào hàng đợi</button><button type="button" onclick="document.querySelector('#modal').close()">Đóng</button></div></form>`;d.showModal();document.querySelector('#run').onsubmit=e=>{e.preventDefault();action(async()=>{await api('/api/enqueue',{project:selected,...Object.fromEntries(new FormData(e.target))});d.close();tab='queue'})}}
function revise(id){let a=detail.artifacts.find(a=>a.id===id),d=document.querySelector('#modal');d.innerHTML=`<h2>Sửa ${labels[a.kind]}</h2><textarea id="revision" style="min-height:380px">${esc(a.body)}</textarea><p class="muted">Các tài liệu phụ thuộc bản cũ sẽ được đánh dấu cần cập nhật.</p><div class="actions"><button class="primary" id="save">Lưu bản mới</button><button onclick="document.querySelector('#modal').close()">Đóng</button></div>`;d.showModal();document.querySelector('#save').onclick=()=>action(async()=>{await api('/api/revise',{project:selected,id,body:document.querySelector('#revision').value});d.close();focused=null})}
function references(){selected=null;document.querySelector('#workspace').innerHTML=`<div class="overline">Kho kỹ thuật kể chuyện</div><h1>Thư viện tham khảo</h1><p class="muted">Nhập tài liệu hoặc ghi chú về nhịp truyện, diễn xuất, bố cục và thoại. Xưởng tham khảo kỹ thuật, không sao chép tác phẩm.</p><div class="card"><form id="ref"><div class="row"><label>Tên tài liệu<input name="title" required></label><label>Thể loại<select name="genre">${state.genres.map(g=>`<option>${esc(g)}</option>`).join('')}</select></label></div><label>Nguồn / liên kết<input name="source"></label><label>Phạm vi sử dụng<select name="rights"><option value="notes_only">Chỉ ghi chú phân tích</option><option value="owned">Tôi sở hữu</option><option value="licensed">Có giấy phép sử dụng</option><option value="public_domain">Public domain</option></select></label><label>Nội dung / ghi chú<textarea name="content" required></textarea></label><label>Nhập TXT / Markdown<input type="file" accept=".txt,.md" id="reffile"></label><div class="actions"><button class="primary">Lưu tài liệu</button></div></form></div><div class="cards">${state.references.map(r=>`<div class="card"><h2>${esc(r.title)}</h2><span class="tag">${esc(r.genre)}</span><p>${esc(r.content.slice(0,200))}</p></div>`).join('')}</div>`;document.querySelector('#reffile').onchange=async e=>{let f=e.target.files[0];if(f)document.querySelector('[name=content]').value=await f.text()};document.querySelector('#ref').onsubmit=e=>{e.preventDefault();action(async()=>{await api('/api/references',Object.fromEntries(new FormData(e.target)));await load();references()})}}
function importPage(){let d=document.querySelector('#modal');d.innerHTML=`<h2>Nhập trang manga từ bộ vẽ</h2><p class="muted">Trang được gắn với bản nguồn và brief hiện hành. Có thể dùng Codex/image_gen hoặc công cụ vẽ khác; xem hướng dẫn studio-director.</p><form id="page"><div class="row"><label>Chương<input name="chapter" type="number" min="1" value="1" required></label><label>Trang<input name="number" type="number" min="1" value="1" required></label></div><label>Ảnh PNG<input id="png" type="file" accept="image/png" required></label><div class="actions"><button class="primary">Nhập trang</button><button type="button" onclick="document.querySelector('#modal').close()">Đóng</button></div></form>`;d.showModal();document.querySelector('#page').onsubmit=e=>{e.preventDefault();action(async()=>{let f=document.querySelector('#png').files[0];if(f.size>12000000)throw Error('PNG tối đa 12MB');let png=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});await api('/api/page',{project:selected,...Object.fromEntries(new FormData(e.target)),png});d.close();tab='reader'})}}



const phaseKinds={idea:[],plot:['bible','outline'],characters:['characters'],art:['art'],production:['draft','edit','continuity','adaptation','storyboard','lettering','image_prompt','page']};
const phaseCopy={idea:['Điểm khởi đầu','Ý tưởng và cảm xúc bạn muốn để lại cho độc giả.'],plot:['Xương sống câu chuyện','Mục tiêu, xung đột, bước ngoặt và những hạt giống cho các chương sau.'],characters:['Những người làm câu chuyện sống','Động lực, quan hệ, giọng nói và diện mạo có thể nhận ra.'],art:['Một thế giới nhìn là nhận ra','Nét vẽ, diễn xuất, cảnh vật và ngôn ngữ thoại cùng một hướng.'],production:['Từ bản gốc đến trang truyện','Viết và kiểm tra bản gốc, rồi chuyển thể và đọc kiểm tra manga.']};
function latestKind(kind){return detail.artifacts.filter(a=>a.chapter===chapter&&a.kind===kind).slice(-1)[0]}
function renderContent(){let c=document.querySelector('#content');if(!c)return;let [title,copy]=phaseCopy[phase];let rows=phaseKinds[phase].map(latestKind).filter(Boolean),a=rows.find(a=>a.id===focused)||rows[rows.length-1];let waiting=detail.jobs.filter(j=>j.chapter===chapter&&j.status==='needs_review').slice(-1)[0],active=detail.jobs.find(j=>j.chapter===chapter&&['running','queued'].includes(j.status)),failed=detail.jobs.filter(j=>j.chapter===chapter&&j.status==='failed').slice(-1)[0];let next=state.stages.find(k=>!latestKind(k)||latestKind(k).stale);c.innerHTML=`<div class="card" style="margin-top:22px"><h2>${title}</h2><p class="muted">${copy}</p>${phase==='idea'?`<p>${esc(detail.project.idea)}</p><div>${detail.project.genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:`<div class="actions">${waiting?`<button class="primary" onclick="action(()=>api('/api/continue',{id:'${waiting.id}'}))">${waiting.stage==='continuity'?'Chốt chương & chuyển thể':'Duyệt kết quả & tiếp tục'}</button>`:active?`<span class="tag">Xưởng đang ${labels[active.stage].toLowerCase()}…</span>`:failed?`<button class="primary" onclick="action(()=>api('/api/retry',{id:'${failed.id}'}))" ${failed.attempts>=3?'disabled':''}>Thử lại công việc</button><span class="error">${esc(failed.error)}</span>`:next?`<button class="primary" onclick="action(()=>api('/api/enqueue',{project:selected,chapter,stage:'${next}'}))">${rows.length?'Tiếp tục sáng tác':'Bắt đầu xây dựng chương'}</button>`:'<span class="tag">Đã chuẩn bị xong nội dung chuyển thể</span>'}</div>`}</div><div class="cards">${rows.filter(a=>a.kind!=='page').map(a=>`<button class="card" style="text-align:left" onclick="focused='${a.id}';renderContent()"><strong>${labels[a.kind]}</strong><p class="muted">${a.stale?'Cần cập nhật vì nguồn đã đổi':a.approved?'Đã chốt':'Sẵn sàng đọc và góp ý'}</p></button>`).join('')}</div>${a&&a.kind!=='page'?`<div class="actions"><button onclick="revise('${a.id}')">Chỉnh sửa nội dung</button></div><pre>${esc(a.body)}</pre>`:phase!=='idea'?'<p class="muted">Nội dung sẽ xuất hiện ở đây khi xưởng hoàn thành công việc.</p>':''}${phase==='production'?`<div class="actions"><a href="/api/export?id=${selected}" download="manuscript.zip"><button>Tải truyện viết</button></a><a href="/api/cbz?id=${selected}&chapter=${chapter}" download="chapter.cbz"><button>Tải manga</button></a><button onclick="importPage()">Thêm trang đã vẽ</button></div><p class="muted">Bộ vẽ tự động chưa được kết nối. Trang manga cần ảnh thật và kiểm tra trực quan.</p>${detail.artifacts.filter(a=>a.chapter===chapter&&a.kind==='page').map(a=>`<div class="card"><span class="tag">Trang ${JSON.parse(a.body).number} · ${a.stale?'Cần cập nhật':a.approved?'Đã chốt':'Chờ đọc kiểm tra'}</span><img class="page" alt="Trang manga" src="/api/page?project=${selected}&id=${a.id}">${!a.approved&&!a.stale?`<button onclick="reviewPage('${a.id}')">Chốt trang sau khi đọc</button>`:''}</div>`).join('')}`:''}`}
function reviewPage(id){let notes=prompt('Nhận xét về thoại, nhân vật và thứ tự đọc:');if(notes)action(()=>api('/api/approve-page',{project:selected,id,notes}))}

load().then(home).catch(e=>notice(e.message));setInterval(async()=>{try{await load();if(selected&&!document.querySelector('#modal').open){let fresh=await api('/api/project?id='+selected);if(JSON.stringify(fresh)!==JSON.stringify(detail)){detail=fresh;renderContent()}}}catch{}},4000);
</script></body></html>
