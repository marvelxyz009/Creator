[project]
name = "aetherforge-orchestrator"
version = "0.1.0"
description = "AetherForge Creator Framework — Python orchestrator (MVP)"
readme = "orchestrator/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "AetherForge Creator Framework contributors" },
]

dependencies = [
    "anthropic>=0.40.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.scripts]
aetherforge = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
exclude = ["orchestrator.runs*", "orchestrator.tests*"]

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
addopts = "-ra --strict-markers"
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]    # line length handled by formatter
