[project]
name = "creator-story-studio"
version = "0.2.0"
description = "Local multi-genre prose-first story and manga production harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "AetherForge Creator Framework contributors" },
]

dependencies = []

[project.optional-dependencies]
legacy = ["anthropic>=0.40.0", "jinja2>=3.1.0", "pyyaml>=6.0", "python-dotenv>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.scripts]
creator-studio = "story_studio.server:main"
creator-agent = "story_studio.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["story_studio*"]

[tool.setuptools.package-data]
story_studio = ["web/*.html", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]    # line length handled by formatter
